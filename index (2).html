<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Legacy War — Epic Fantasy RPG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 80px;
            color: #fff;
        }

        .game-container {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 80px 16px;
            min-height: 100vh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 10px 15px;
        }

        .balance-panel {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .balance-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .balance-item:hover {
            transform: scale(1.05);
            background: rgba(0, 0, 0, 0.8);
        }

        .balance-item i {
            font-size: 16px;
        }

        .balance-item .aden { color: #ffd700; }
        .balance-item .stars { color: #ff6b9d; }
        .balance-item .ton { color: #0088cc; }
        .balance-item .energy { color: #00ff88; }

        .settings-btn {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            transform: rotate(90deg);
            background: rgba(0, 0, 0, 0.8);
        }

        .stats-bar {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .player-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        .player-level {
            background: linear-gradient(45deg, #ffd700, #ffb347);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #1a1a2e;
            font-weight: bold;
        }

        .stat-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .hp-fill { background: linear-gradient(90deg, #d44c2f, #ff6b4a); }
        .mp-fill { background: linear-gradient(90deg, #3a6ea5, #5b8dc7); }
        .exp-fill { background: linear-gradient(90deg, #ffd700, #ffb347); }

        .content-window {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3);
            min-height: 400px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            border-top: 1px solid rgba(255, 215, 0, 0.5);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px 12px;
            border-radius: 30px;
            flex: 1;
        }

        .nav-item.active {
            background: linear-gradient(45deg, #ffd700, #ffb347);
        }

        .nav-icon {
            font-size: 22px;
            color: #ffd700;
        }

        .nav-item.active .nav-icon {
            color: #1a1a2e;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            color: #ffd700;
        }

        .nav-item.active .nav-label {
            color: #1a1a2e;
        }

        .action-btn {
            background: linear-gradient(45deg, #ffd700, #ffb347);
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 5px;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn-danger {
            background: linear-gradient(45deg, #d44c2f, #ff6b4a);
            color: white;
        }

        .action-btn-success {
            background: linear-gradient(45deg, #4caf50, #8bc34a);
            color: white;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .menu-card:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-3px);
        }

        .menu-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .monster-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .monster-card:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.02);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .chat-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .chat-tab {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: #ffd700;
            transition: all 0.2s;
        }

        .chat-tab.active {
            background: linear-gradient(45deg, #ffd700, #ffb347);
            color: #1a1a2e;
        }

        .chat-messages {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .chat-message {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            color: #fff;
        }

        .chat-message strong {
            color: #ffd700;
        }

        .chat-message .time {
            float: right;
            color: #888;
            font-size: 10px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #ffd700;
            background: rgba(0, 0, 0, 0.8);
            color: white;
        }

        .chat-input button {
            background: linear-gradient(45deg, #ffd700, #ffb347);
            border: none;
            width: 50px;
            border-radius: 25px;
            cursor: pointer;
            color: #1a1a2e;
            font-weight: bold;
        }

        .setting-group {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
        }

        .setting-group h4 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        .setting-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            cursor: pointer;
        }

        .fighter-card {
            flex: 1;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 15px;
        }

        .fighter-card.player { border: 2px solid #4caf50; }
        .fighter-card.opponent { border: 2px solid #f44336; }

        .fighter-avatar {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .fighter-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .fighter-hp-bar {
            background: rgba(255, 255, 255, 0.2);
            height: 10px;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }

        .fighter-hp-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .fighter-card.player .fighter-hp-fill {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
        }

        .fighter-card.opponent .fighter-hp-fill {
            background: linear-gradient(90deg, #f44336, #ff6b4a);
        }

        .vs {
            display: flex;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: #ffd700;
            padding: 0 15px;
        }

        .battle-log {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-size: 12px;
            margin: 20px 0;
        }

        .battle-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        @keyframes hitFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); background: rgba(255, 215, 0, 0.5); }
        }

        .hit-effect {
            animation: hitFlash 0.2s ease-out;
        }

        .clan-card {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all .2s;
        }

        .clan-card:active {
            transform: scale(0.98);
            border-color: #ffd700;
        }

        .clan-member {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
        }

        .modal-action-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
        }

        .modal-action-btn:active {
            transform: scale(0.97);
        }

        .btn-gold {
            background: linear-gradient(135deg, #b8860b, #ffd700);
            color: #1a1a2e;
        }

        .btn-red {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: #fff;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 2000;
            animation: fadeInOut 2s ease;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        #modalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        #modalOverlay.open {
            display: flex !important;
        }

        #modalBox {
            background: linear-gradient(180deg, #1a1a2e, #16213e);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 16px 40px;
            border-top: 2px solid rgba(255, 215, 0, 0.3);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .balance-item span {
                display: inline;
            }
            .nav-label {
                font-size: 9px;
            }
            .fighter-card {
                padding: 10px;
            }
            .fighter-avatar {
                font-size: 30px;
            }
            .vs {
                font-size: 20px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="balance-panel">
            <div class="balance-item" onclick="showBalanceMenu()">
                <i class="fas fa-coins aden"></i>
                <span id="adenAmount">0</span>
            </div>
            <div class="balance-item" onclick="showBalanceMenu()">
                <i class="fas fa-gem stars"></i>
                <span id="starsAmount">0</span>
            </div>
            <div class="balance-item" onclick="showBalanceMenu()">
                <i class="fab fa-ton ton"></i>
                <span id="tonAmount">0</span>
            </div>
            <!-- НОВОЕ: Энергия -->
            <div class="balance-item" onclick="showEnergyMenu()">
                <i class="fas fa-bolt energy"></i>
                <span id="energyAmount">20</span>
            </div>
        </div>
        <button class="settings-btn" onclick="showSettings()">
            <i class="fas fa-cog"></i>
        </button>
    </div>

    <!-- Статистика игрока -->
    <div class="stats-bar">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span class="player-name" id="playerName">Hero</span>
            <span class="player-level">Ур. <span id="playerLevel">1</span></span>
        </div>
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <div style="font-size: 10px; color: #ffd700;">❤️ HP</div>
                <div class="stat-bar-bg"><div class="stat-bar-fill hp-fill" id="hpBar" style="width: 100%; height: 8px;"></div></div>
                <span style="font-size: 10px;" id="hpValue">100/100</span>
            </div>
            <div style="flex: 1;">
                <div style="font-size: 10px; color: #ffd700;">💙 MP</div>
                <div class="stat-bar-bg"><div class="stat-bar-fill mp-fill" id="mpBar" style="width: 100%; height: 8px;"></div></div>
                <span style="font-size: 10px;" id="mpValue">50/50</span>
            </div>
        </div>
        <div style="margin-top: 8px;">
            <div style="font-size: 10px; color: #ffd700;">⭐ ОПЫТ</div>
            <div class="stat-bar-bg"><div class="stat-bar-fill exp-fill" id="expBar" style="width: 0%; height: 8px;"></div></div>
            <span style="font-size: 10px;" id="expValue">0/100</span>
        </div>
    </div>

    <!-- Основной контент -->
    <div id="contentWindow" class="content-window">
        <div id="contentArea">✨ Добро пожаловать в Legacy War! ✨<br>Выберите вкладку внизу</div>
    </div>
</div>

<!-- Нижняя навигация -->
<div class="bottom-nav">
    <div class="nav-item" data-tab="combat" onclick="switchTab('combat')">
        <i class="fas fa-fist-raised nav-icon"></i>
        <span class="nav-label">БОЙ</span>
    </div>
    <div class="nav-item" data-tab="inventory" onclick="switchTab('inventory')">
        <i class="fas fa-box-open nav-icon"></i>
        <span class="nav-label">ИНВЕНТАРЬ</span>
    </div>
    <div class="nav-item" data-tab="clans" onclick="switchTab('clans')">
        <i class="fas fa-shield-alt nav-icon"></i>
        <span class="nav-label">КЛАНЫ</span>
    </div>
    <div class="nav-item" data-tab="trade" onclick="switchTab('trade')">
        <i class="fas fa-store nav-icon"></i>
        <span class="nav-label">ТОРГОВЛЯ</span>
    </div>
    <div class="nav-item" data-tab="skills" onclick="switchTab('skills')">
        <i class="fas fa-magic nav-icon"></i>
        <span class="nav-label">НАВЫКИ</span>
    </div>
</div>

<!-- Модальное окно -->
<div id="modalOverlay" onclick="closeModal(event)">
    <div id="modalBox">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
            <h2 id="modalTitle" style="color:#ffd700; font-size:18px"></h2>
            <button onclick="closeModalDirect()" style="background:rgba(255,255,255,0.1); border:none; color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:18px">×</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
